<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Orlo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1A1A1A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: linear-gradient(to bottom, rgba(26, 26, 26, 0.85) 0%, rgba(26, 26, 26, 0.0) 100%);
      pointer-events: none;
    }

    #logo {
      font-size: 22px;
      font-weight: 700;
      color: #F7F5F0;
      letter-spacing: 0.04em;
      pointer-events: auto;
    }

    /* Remove Leaflet attribution clutter on mobile */
    .leaflet-control-attribution {
      font-size: 9px;
      opacity: 0.6;
    }

    /* Custom circle marker */
    .orlo-marker {
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    /* ── Filter pills ── */
    #filter-bar {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      gap: 8px;
      padding: 8px 16px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    #filter-bar::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex-shrink: 0;
      height: 34px;
      padding: 0 15px;
      border-radius: 17px;
      background: #F7F5F0;
      color: #1A1A1A;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s, color 0.18s, transform 0.1s;
    }

    .pill:active {
      transform: scale(0.95);
    }

    .pill.active {
      background: #1A1A1A;
      color: #F7F5F0;
    }

    /* ── Bottom nav ── */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 150;
      background: #1A1A1A;
      display: flex;
      align-items: flex-start;
      padding-top: 12px;
      padding-bottom: env(safe-area-inset-bottom, 8px);
      border-top: 1px solid rgba(247, 245, 240, 0.08);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding-bottom: 4px;
      color: rgba(247, 245, 240, 0.38);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
      user-select: none;
    }

    .nav-item.active {
      color: #F7F5F0;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    /* ── Bottom sheet ── */
    #sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: #F7F5F0;
      border-radius: 20px 20px 0 0;
      padding: 12px 24px calc(28px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.18);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
    }

    #sheet.open {
      transform: translateY(0);
    }

    #sheet-handle {
      width: 36px;
      height: 4px;
      background: rgba(26, 26, 26, 0.18);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    #sheet-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #F7F5F0;
      border-radius: 20px;
      padding: 3px 10px;
      margin-bottom: 12px;
    }

    #sheet-name {
      font-size: 24px;
      font-weight: 700;
      color: #1A1A1A;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    #sheet-description {
      font-size: 14px;
      color: #555;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    #sheet-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    #sheet-price {
      font-size: 15px;
      font-weight: 600;
      color: #1A1A1A;
    }

    #sheet-availability {
      font-size: 13px;
      font-weight: 500;
    }

    #sheet-availability.available {
      color: #3A9E6A;
    }

    #sheet-availability.limited {
      color: #D4870A;
    }

    #sheet-book {
      display: block;
      width: 100%;
      padding: 17px;
      background: #1A1A1A;
      color: #F7F5F0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    #sheet-book:active {
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="top-bar">
    <span id="logo">Orlo</span>
  </div>

  <!-- Filter pills -->
  <div id="filter-bar">
    <button class="pill active" data-filter="all">All</button>
    <button class="pill" data-filter="tonight">Tonight</button>
    <button class="pill" data-filter="food">Food</button>
    <button class="pill" data-filter="sport">Sport</button>
    <button class="pill" data-filter="culture">Culture</button>
    <button class="pill" data-filter="free">Free</button>
  </div>

  <!-- Bottom sheet -->
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Venue details">
    <div id="sheet-handle"></div>
    <span id="sheet-pill"></span>
    <h2 id="sheet-name"></h2>
    <p id="sheet-description"></p>
    <div id="sheet-meta">
      <span id="sheet-price"></span>
      <span id="sheet-availability"></span>
    </div>
    <button id="sheet-book">Book Now</button>
  </div>

  <!-- Bottom nav -->
  <nav id="bottom-nav" aria-label="Main navigation">
    <div class="nav-item active" data-nav="map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
      <span>Map</span>
    </div>
    <div class="nav-item" data-nav="discover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88"/>
      </svg>
      <span>Discover</span>
    </div>
    <div class="nav-item" data-nav="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7.5"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span>Search</span>
    </div>
    <div class="nav-item" data-nav="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Profile</span>
    </div>
  </nav>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
      center: [51.4875, -0.1687],
      zoom: 15,
      zoomControl: false,
      attributionControl: true
    });

    // CartoDB Positron — clean, minimal light tile style
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Category colours
    const COLOURS = {
      restaurant: '#4CAF82',  // green
      sport:      '#4A90D9',  // blue
      culture:    '#9B6FD4',  // purple
      experience: '#F5A623'   // amber
    };

    function circleIcon(colour) {
      return L.divIcon({
        className: '',
        html: `<div class="orlo-marker" style="width:18px;height:18px;background:${colour};"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
    }

    const venues = [
      {
        name: 'Josephine Bouchon',
        category: 'restaurant',
        lat: 51.4889, lng: -0.1701,
        description: 'French bistro on Elystan Street',
        price: '£35pp',
        availability: 'Available now'
      },
      {
        name: 'White City Tennis',
        category: 'sport',
        lat: 51.4812, lng: -0.1756,
        description: 'Book a court on Fulham Road',
        price: '£18 per hour',
        availability: 'Available now'
      },
      {
        name: 'Saatchi Gallery',
        category: 'culture',
        lat: 51.4921, lng: -0.1598,
        description: "Free contemporary art on King's Road",
        price: 'Free',
        availability: 'Opens at 10am'
      },
      {
        name: 'Turning Earth Pottery',
        category: 'experience',
        lat: 51.4834, lng: -0.1823,
        description: 'Wheel throwing class',
        price: '£45pp',
        availability: '2 spots left'
      },
      {
        name: 'The Wee Sister',
        category: 'restaurant',
        lat: 51.4856, lng: -0.1734,
        description: 'Irish wine bar on Park Walk',
        price: '£25pp',
        availability: 'Available now'
      },
      {
        name: 'Chelsea Physic Garden',
        category: 'culture',
        lat: 51.4847, lng: -0.1689,
        description: 'Hidden historic garden',
        price: '£12',
        availability: 'Opens at 11am'
      },
      {
        name: 'Rabbit Restaurant',
        category: 'restaurant',
        lat: 51.4878, lng: -0.1712,
        description: "Farm to fork on King's Road",
        price: '£40pp',
        availability: 'Available now'
      },
      {
        name: 'Three Darlings',
        category: 'experience',
        lat: 51.4901, lng: -0.1623,
        description: 'All day cafe on Pavilion Road',
        price: '£15pp',
        availability: 'Available now'
      }
    ];

    // ── Bottom sheet logic ──
    const sheet    = document.getElementById('sheet');
    const pilEl    = document.getElementById('sheet-pill');
    const nameEl   = document.getElementById('sheet-name');
    const descEl   = document.getElementById('sheet-description');
    const priceEl  = document.getElementById('sheet-price');
    const availEl  = document.getElementById('sheet-availability');

    function openSheet(v) {
      const colour = COLOURS[v.category];
      pilEl.textContent  = v.category;
      pilEl.style.background = colour;
      nameEl.textContent = v.name;
      descEl.textContent = v.description;
      priceEl.textContent = v.price;
      availEl.textContent = v.availability;
      const isAvailable = v.availability.toLowerCase() === 'available now';
      availEl.className = isAvailable ? 'available' : 'limited';
      sheet.classList.add('open');
    }

    function closeSheet() {
      sheet.classList.remove('open');
    }

    // Close when tapping the map (not the sheet)
    map.on('click', closeSheet);

    // Prevent sheet taps from bubbling to the map
    sheet.addEventListener('click', e => e.stopPropagation());

    // Store marker reference on each venue object
    venues.forEach(v => {
      const colour = COLOURS[v.category];
      v.marker = L.marker([v.lat, v.lng], { icon: circleIcon(colour) });
      v.marker.on('click', e => {
        L.DomEvent.stopPropagation(e);
        openSheet(v);
      });
      v.marker.addTo(map);
    });

    // ── Filter pills ──
    const filterTests = {
      all:     () => true,
      tonight: v => v.availability.toLowerCase() === 'available now',
      food:    v => v.category === 'restaurant',
      sport:   v => v.category === 'sport',
      culture: v => v.category === 'culture',
      free:    v => v.price.toLowerCase() === 'free'
    };

    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');

        const test = filterTests[pill.dataset.filter];
        venues.forEach(v => {
          const show = test(v);
          if (show && !map.hasLayer(v.marker)) v.marker.addTo(map);
          if (!show && map.hasLayer(v.marker)) map.removeLayer(v.marker);
        });

        closeSheet();
      });
    });

    // ── Bottom nav tab switching ──
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>

</body>
</html>
