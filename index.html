<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Orlo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1A1A1A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: linear-gradient(to bottom, rgba(26, 26, 26, 0.85) 0%, rgba(26, 26, 26, 0.0) 100%);
      pointer-events: none;
    }

    #logo {
      font-size: 22px;
      font-weight: 700;
      color: #F7F5F0;
      letter-spacing: 0.04em;
      pointer-events: auto;
    }

    /* Remove Leaflet attribution clutter on mobile */
    .leaflet-control-attribution {
      font-size: 9px;
      opacity: 0.6;
    }

    /* Custom circle marker */
    .orlo-marker {
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="top-bar">
    <span id="logo">Orlo</span>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
      center: [51.4875, -0.1687],
      zoom: 15,
      zoomControl: false,
      attributionControl: true
    });

    // CartoDB Positron — clean, minimal light tile style
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Category colours
    const COLOURS = {
      restaurant: '#4CAF82',  // green
      sport:      '#4A90D9',  // blue
      culture:    '#9B6FD4',  // purple
      experience: '#F5A623'   // amber
    };

    function circleIcon(colour) {
      return L.divIcon({
        className: '',
        html: `<div class="orlo-marker" style="width:18px;height:18px;background:${colour};"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
    }

    const venues = [
      {
        name: 'Josephine Bouchon',
        category: 'restaurant',
        lat: 51.4889, lng: -0.1701,
        description: 'French bistro on Elystan Street',
        price: '£35pp',
        availability: 'Available now'
      },
      {
        name: 'White City Tennis',
        category: 'sport',
        lat: 51.4812, lng: -0.1756,
        description: 'Book a court on Fulham Road',
        price: '£18 per hour',
        availability: 'Available now'
      },
      {
        name: 'Saatchi Gallery',
        category: 'culture',
        lat: 51.4921, lng: -0.1598,
        description: "Free contemporary art on King's Road",
        price: 'Free',
        availability: 'Opens at 10am'
      },
      {
        name: 'Turning Earth Pottery',
        category: 'experience',
        lat: 51.4834, lng: -0.1823,
        description: 'Wheel throwing class',
        price: '£45pp',
        availability: '2 spots left'
      },
      {
        name: 'The Wee Sister',
        category: 'restaurant',
        lat: 51.4856, lng: -0.1734,
        description: 'Irish wine bar on Park Walk',
        price: '£25pp',
        availability: 'Available now'
      },
      {
        name: 'Chelsea Physic Garden',
        category: 'culture',
        lat: 51.4847, lng: -0.1689,
        description: 'Hidden historic garden',
        price: '£12',
        availability: 'Opens at 11am'
      },
      {
        name: 'Rabbit Restaurant',
        category: 'restaurant',
        lat: 51.4878, lng: -0.1712,
        description: "Farm to fork on King's Road",
        price: '£40pp',
        availability: 'Available now'
      },
      {
        name: 'Three Darlings',
        category: 'experience',
        lat: 51.4901, lng: -0.1623,
        description: 'All day cafe on Pavilion Road',
        price: '£15pp',
        availability: 'Available now'
      }
    ];

    venues.forEach(v => {
      const colour = COLOURS[v.category];
      const marker = L.marker([v.lat, v.lng], { icon: circleIcon(colour) });
      marker.addTo(map);
    });
  </script>

</body>
</html>
