<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Orlo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1A1A1A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: linear-gradient(to bottom, rgba(26, 26, 26, 0.85) 0%, rgba(26, 26, 26, 0.0) 100%);
      pointer-events: none;
    }

    #logo {
      font-size: 22px;
      font-weight: 700;
      color: #F7F5F0;
      letter-spacing: 0.04em;
      pointer-events: auto;
    }

    /* Remove Leaflet attribution clutter on mobile */
    .leaflet-control-attribution {
      font-size: 9px;
      opacity: 0.6;
    }

    /* Custom circle marker */
    .orlo-marker {
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    /* ── Bottom sheet ── */
    #sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: #F7F5F0;
      border-radius: 20px 20px 0 0;
      padding: 12px 24px 36px;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.18);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
    }

    #sheet.open {
      transform: translateY(0);
    }

    #sheet-handle {
      width: 36px;
      height: 4px;
      background: rgba(26, 26, 26, 0.18);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    #sheet-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #F7F5F0;
      border-radius: 20px;
      padding: 3px 10px;
      margin-bottom: 12px;
    }

    #sheet-name {
      font-size: 24px;
      font-weight: 700;
      color: #1A1A1A;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    #sheet-description {
      font-size: 14px;
      color: #555;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    #sheet-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    #sheet-price {
      font-size: 15px;
      font-weight: 600;
      color: #1A1A1A;
    }

    #sheet-availability {
      font-size: 13px;
      font-weight: 500;
    }

    #sheet-availability.available {
      color: #3A9E6A;
    }

    #sheet-availability.limited {
      color: #D4870A;
    }

    #sheet-book {
      display: block;
      width: 100%;
      padding: 17px;
      background: #1A1A1A;
      color: #F7F5F0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    #sheet-book:active {
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="top-bar">
    <span id="logo">Orlo</span>
  </div>

  <!-- Bottom sheet -->
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Venue details">
    <div id="sheet-handle"></div>
    <span id="sheet-pill"></span>
    <h2 id="sheet-name"></h2>
    <p id="sheet-description"></p>
    <div id="sheet-meta">
      <span id="sheet-price"></span>
      <span id="sheet-availability"></span>
    </div>
    <button id="sheet-book">Book Now</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
      center: [51.4875, -0.1687],
      zoom: 15,
      zoomControl: false,
      attributionControl: true
    });

    // CartoDB Positron — clean, minimal light tile style
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Category colours
    const COLOURS = {
      restaurant: '#4CAF82',  // green
      sport:      '#4A90D9',  // blue
      culture:    '#9B6FD4',  // purple
      experience: '#F5A623'   // amber
    };

    function circleIcon(colour) {
      return L.divIcon({
        className: '',
        html: `<div class="orlo-marker" style="width:18px;height:18px;background:${colour};"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
    }

    const venues = [
      {
        name: 'Josephine Bouchon',
        category: 'restaurant',
        lat: 51.4889, lng: -0.1701,
        description: 'French bistro on Elystan Street',
        price: '£35pp',
        availability: 'Available now'
      },
      {
        name: 'White City Tennis',
        category: 'sport',
        lat: 51.4812, lng: -0.1756,
        description: 'Book a court on Fulham Road',
        price: '£18 per hour',
        availability: 'Available now'
      },
      {
        name: 'Saatchi Gallery',
        category: 'culture',
        lat: 51.4921, lng: -0.1598,
        description: "Free contemporary art on King's Road",
        price: 'Free',
        availability: 'Opens at 10am'
      },
      {
        name: 'Turning Earth Pottery',
        category: 'experience',
        lat: 51.4834, lng: -0.1823,
        description: 'Wheel throwing class',
        price: '£45pp',
        availability: '2 spots left'
      },
      {
        name: 'The Wee Sister',
        category: 'restaurant',
        lat: 51.4856, lng: -0.1734,
        description: 'Irish wine bar on Park Walk',
        price: '£25pp',
        availability: 'Available now'
      },
      {
        name: 'Chelsea Physic Garden',
        category: 'culture',
        lat: 51.4847, lng: -0.1689,
        description: 'Hidden historic garden',
        price: '£12',
        availability: 'Opens at 11am'
      },
      {
        name: 'Rabbit Restaurant',
        category: 'restaurant',
        lat: 51.4878, lng: -0.1712,
        description: "Farm to fork on King's Road",
        price: '£40pp',
        availability: 'Available now'
      },
      {
        name: 'Three Darlings',
        category: 'experience',
        lat: 51.4901, lng: -0.1623,
        description: 'All day cafe on Pavilion Road',
        price: '£15pp',
        availability: 'Available now'
      }
    ];

    // ── Bottom sheet logic ──
    const sheet    = document.getElementById('sheet');
    const pilEl    = document.getElementById('sheet-pill');
    const nameEl   = document.getElementById('sheet-name');
    const descEl   = document.getElementById('sheet-description');
    const priceEl  = document.getElementById('sheet-price');
    const availEl  = document.getElementById('sheet-availability');

    function openSheet(v) {
      const colour = COLOURS[v.category];
      pilEl.textContent  = v.category;
      pilEl.style.background = colour;
      nameEl.textContent = v.name;
      descEl.textContent = v.description;
      priceEl.textContent = v.price;
      availEl.textContent = v.availability;
      const isAvailable = v.availability.toLowerCase() === 'available now';
      availEl.className = isAvailable ? 'available' : 'limited';
      sheet.classList.add('open');
    }

    function closeSheet() {
      sheet.classList.remove('open');
    }

    // Close when tapping the map (not the sheet)
    map.on('click', closeSheet);

    // Prevent sheet taps from bubbling to the map
    sheet.addEventListener('click', e => e.stopPropagation());

    venues.forEach(v => {
      const colour = COLOURS[v.category];
      const marker = L.marker([v.lat, v.lng], { icon: circleIcon(colour) });
      marker.on('click', e => {
        L.DomEvent.stopPropagation(e);
        openSheet(v);
      });
      marker.addTo(map);
    });
  </script>

</body>
</html>
